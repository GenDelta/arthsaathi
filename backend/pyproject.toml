[project]
name = "arthsaathi-backend"
version = "0.1.0"
description = "ArthSaathi backend — multi-agent financial-literacy platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    "lancedb>=0.12.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-ollama>=0.3.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=6.0.0",
    "pyotp>=2.10.0",
    "qrcode[pil]>=8.2",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.0",   # Phase 3: bank-statement PDF table extraction
    "pikepdf>=9.0.0",       # Phase 3: in-memory PDF decryption
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that call live LLM APIs (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN", "S", "B", "C4", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]   # allow assert and skip annotations in tests
"scripts/**" = ["ANN"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
